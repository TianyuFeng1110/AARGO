hidden_dim: 1024
esm_dim: 1280

model_type: 1                # 0: custom, 1: custom + prototype (gate fusion), 2: prototype
features_path: /archive/hot5/fty/
checkpoint_path: /archive/hot5/fty/checkpoints/

checkpoint_custom: checkpoint_97.pth # 检查点使用情况：TALE(CC) 63，TALE(MF) 84，TALE(BP) 65，CAFA3(CC) 51，CAFA3(MF) 93，CAFA3(BP) 97
checkpoint_proto: checkpoint_30.pth # 检查点使用情况：TALE(CC) 87，TALE(MF) 86，TALE(BP) 55，CAFA3(CC) 57，CAFA3(MF) 60，CAFA3(BP) 30

dataset: CAFA3
datasets_path: './data_tale/'

# 原型网络超参（model_type=1/2 时使用）
alpha: 20                     # smooth_tau
lambda: 10                    # IC 衰减权重
beta: 2                       # △IC 衰减速率

# 门控超参（model_type=1 时使用）：sigma = n/(n+tau_g)，n 为训练正样本数
tau_g: 0.0                    # 半饱和常数：越小越接近硬门控，可根据参数化模块自定义调整,0则退化为硬门控

namespace: BP
queue_size: 50

zero_shot: True